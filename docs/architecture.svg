<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" role="img" aria-labelledby="title desc">
  <title id="title">Data flow of the OpenRouter Plasma widget</title>
  <desc id="desc">OpenRouterApi polls four OpenRouter endpoints and feeds the panel representation and the three popup tabs.</desc>

  <style>
    .box   { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; rx: 8; }
    .api   { fill: #eef4ff; stroke: #7aa2f7; stroke-width: 1.5; }
    .core  { fill: #e8f5ee; stroke: #3fb950; stroke-width: 1.5; }
    .ui    { fill: #fff5e6; stroke: #d29922; stroke-width: 1.5; }
    .t     { font: 13px sans-serif; fill: #1f2328; }
    .tb    { font: bold 13px sans-serif; fill: #1f2328; }
    .ts    { font: 11px sans-serif; fill: #57606a; }
    .arrow { stroke: #8c959f; stroke-width: 1.4; fill: none; marker-end: url(#a); }
    @media (prefers-color-scheme: dark) {
      .box  { fill: #161b22; stroke: #30363d; }
      .api  { fill: #10182b; stroke: #4c6ef5; }
      .core { fill: #0f1f16; stroke: #2ea043; }
      .ui   { fill: #241c0c; stroke: #9e6a03; }
      .t, .tb { fill: #e6edf3; }
      .ts   { fill: #8b949e; }
      .arrow { stroke: #6e7681; }
    }
  </style>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8c959f"/>
    </marker>
  </defs>

  <!-- Endpoints -->
  <g>
    <rect class="box api" x="10" y="20" width="200" height="40"/>
    <text class="tb" x="24" y="38">GET /key</text>
    <text class="ts" x="24" y="53">limit, tier, per-key usage</text>

    <rect class="box api" x="10" y="72" width="200" height="40"/>
    <text class="tb" x="24" y="90">GET /credits</text>
    <text class="ts" x="24" y="105">purchased and spent totals</text>

    <rect class="box api" x="10" y="124" width="200" height="40"/>
    <text class="tb" x="24" y="142">GET /activity</text>
    <text class="ts" x="24" y="157">30 days, account-wide</text>

    <rect class="box api" x="10" y="176" width="200" height="40"/>
    <text class="tb" x="24" y="194">GET /models</text>
    <text class="ts" x="24" y="209">catalogue and pricing</text>
  </g>

  <!-- Core -->
  <rect class="box core" x="300" y="60" width="230" height="150"/>
  <text class="tb" x="318" y="84">OpenRouterApi.qml</text>
  <text class="ts" x="318" y="104">XHR + polling timers</text>
  <text class="ts" x="318" y="122">defensive JSON parsing</text>
  <text class="ts" x="318" y="140">account-wide period sums</text>
  <text class="ts" x="318" y="158">key from config or file</text>
  <text class="ts" x="318" y="182">lives in main.qml, so polling</text>
  <text class="ts" x="318" y="196">continues while the popup is closed</text>

  <!-- Consumers -->
  <rect class="box ui" x="620" y="20" width="250" height="52"/>
  <text class="tb" x="638" y="42">CompactView.qml</text>
  <text class="ts" x="638" y="60">panel: any chosen metrics</text>

  <rect class="box ui" x="620" y="84" width="250" height="46"/>
  <text class="tb" x="638" y="106">OverviewTab.qml</text>
  <text class="ts" x="638" y="122">credit, spending, key details</text>

  <rect class="box ui" x="620" y="142" width="250" height="46"/>
  <text class="tb" x="638" y="164">ModelsTab.qml</text>
  <text class="ts" x="638" y="180">search, prices, cost calculator</text>

  <rect class="box ui" x="620" y="200" width="250" height="46"/>
  <text class="tb" x="638" y="222">ActivityTab.qml</text>
  <text class="ts" x="638" y="238">daily chart, per-model split</text>

  <!-- Support -->
  <rect class="box" x="300" y="250" width="230" height="46"/>
  <text class="tb" x="318" y="272">L10n.qml</text>
  <text class="ts" x="318" y="288">every translatable string</text>

  <rect class="box" x="300" y="316" width="230" height="46"/>
  <text class="tb" x="318" y="338">code/utils.js</text>
  <text class="ts" x="318" y="354">pure maths, no wording</text>

  <rect class="box" x="620" y="280" width="250" height="46"/>
  <text class="tb" x="638" y="302">contents/locale/&lt;lang&gt;/</text>
  <text class="ts" x="638" y="318">gettext catalogue per language</text>

  <!-- Arrows -->
  <path class="arrow" d="M 214 40 C 260 40 260 100 296 108"/>
  <path class="arrow" d="M 214 92 C 260 92 260 112 296 118"/>
  <path class="arrow" d="M 214 144 C 260 144 260 140 296 138"/>
  <path class="arrow" d="M 214 196 C 260 196 260 170 296 152"/>

  <path class="arrow" d="M 534 100 C 580 100 580 50 616 46"/>
  <path class="arrow" d="M 534 118 C 580 118 580 105 616 107"/>
  <path class="arrow" d="M 534 140 C 580 140 580 162 616 165"/>
  <path class="arrow" d="M 534 165 C 580 165 580 220 616 223"/>

  <path class="arrow" d="M 415 246 L 415 214"/>
  <path class="arrow" d="M 415 312 L 415 300"/>
  <path class="arrow" d="M 534 290 L 616 300"/>

  <text class="ts" x="10" y="390">Every representation receives the same OpenRouterApi instance as a property,</text>
  <text class="ts" x="10" y="408">so there is one poller and one state, no matter how often the popup is rebuilt.</text>
</svg>
